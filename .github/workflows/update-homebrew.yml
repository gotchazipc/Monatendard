name: Update Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: "게시가 완료된 정식 릴리스 태그"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "정식 릴리스 태그 (비우면 최신 정식 릴리스)"
        type: string
      source_repository:
        description: "릴리스 저장소 owner/name (비우면 현재 저장소, fork 시험 시 원본 지정)"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-homebrew-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-verify:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_DEVELOPER: "1"
    steps:
      - name: 갱신 대상 브랜치 결정
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" && "$REF_TYPE" == "branch" ]]; then
            echo "base=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "base=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 공식 ZIP 체크섬 검증 및 Cask 갱신
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python packaging/update_homebrew.py --repository "$SOURCE_REPOSITORY" --tag "$RELEASE_TAG"
      - name: 갱신한 Cask 스타일·설치·제거 검사
        run: bash packaging/check_homebrew.sh
      - name: 검증 완료 PR 생성 또는 갱신
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: ${{ steps.target.outputs.base }}
          branch: automation/homebrew-${{ steps.update.outputs.version }}
          add-paths: Casks/*.rb
          commit-message: "chore: update Homebrew fonts to ${{ steps.update.outputs.version }}"
          title: "Homebrew 폰트 ${{ steps.update.outputs.version }} 갱신"
          body: |
            공식 정식 릴리스에 맞춰 Desktop·Nerd Cask의 버전과 체크섬을 갱신합니다.

            이 PR을 생성하기 전에 동일한 macOS job에서 공식 SHA256SUMS.txt 대조,
            ZIP의 TTF 경로, Cask 스타일, 두 패키지의 설치·TTF 28개·제거 검사를 통과했습니다.
            앱 화면 렌더링과 이전 버전에서의 업그레이드는 이 검사에 포함되지 않습니다.

            검증 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 실행 결과 기록
        env:
          VERSION: ${{ steps.update.outputs.version }}
          CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          echo "검증 버전: $VERSION / Cask 변경: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHANGED" != "true" ]]; then
            echo "이미 같은 Cask입니다. 추가 PR을 만들지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
