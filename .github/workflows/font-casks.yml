name: Font casks

on:
  pull_request:
    paths:
      - "Casks/**"
      - "packaging/macos/**"
      - ".github/workflows/*font-casks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-uninstall:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_DEVELOPER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cask 스타일·설치·제거 검사
        run: bash packaging/macos/verify_casks.sh
